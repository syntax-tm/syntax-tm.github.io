      -moz-animation: bg-kf 20s infinite alternate linear both;
      -o-animation: bg-kf 20s infinite alternate linear both;
      animation: bg-kf 20s infinite alternate linear both;
    }

    @-webkit-keyframes bg-kf {
      0% { fill: #5c416e }
      25% { fill: #554283 }
      50% { fill: #47548f }
      75% { fill: #429194 }
      100% { fill: #4d8d66 }
    }
    @-moz-keyframes bg-kf {
      0% { fill: #5c416e }
      25% { fill: #554283 }
      50% { fill: #47548f }
      75% { fill: #429194 }
      100% { fill: #4d8d66 }
    }
    @keyframes bg-kf {
      0% { fill: #5c416e }
      25% { fill: #554283 }
      50% { fill: #47548f }
      75% { fill: #429194 }
      100% { fill: #4d8d66 }
    }
    </style>
